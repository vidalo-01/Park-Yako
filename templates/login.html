<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — Park Yako</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="hazard-strip"></div>
<header>
    <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="8" width="6" height="22" fill="#a9a79f"/>
            <g transform="rotate(-18 9 12)">
                <rect x="9" y="9" width="24" height="6" fill="#ffc72c"/>
                <rect x="9" y="9" width="6" height="6" fill="#1a1a1a"/>
                <rect x="21" y="9" width="6" height="6" fill="#1a1a1a"/>
            </g>
        </svg>
        <div>
            <h1>Park Yako</h1>
            <span class="tag">staff access</span>
        </div>
    </div>
</header>
<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <div class="kiosk login-card">
        <h2>Staff login</h2>
        <p>Sign in to access the Park Yako parking dashboard.</p>
        <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</main>
</body>
</html>
